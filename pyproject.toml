[project]
name = "jobscout"
version = "0.1.0"
description = "Fetches job postings matching a profile, scores each with an LLM against a rubric, writes a ranked daily shortlist."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# `pip install -e ".[claude]"` to use the Anthropic provider in assess.py
claude = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
jobscout = "jobscout.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
